{% extends "base.html" %}

{% block content %}
   <form action = "" method = "post">
      <table>
         <tr>
            <td>Pin:</td>
            <td>Description:</td>
            <td>Mode:</td>
            <td>Value:</td>
         </tr>
         <tr>
            <td><input name = "pin"/></td>
            <td><input name = "description"/></td>
            <td><select name="mode" id="mode">
               <option value="Disabled">Disabled</option>
               <option value="Inactive" selected>Inactive</option>
               <option value="Output">Output</option>
               <option value="Input">Input</option>
               <option value="PWM">PWM</option>
            </select></td>
            <td><input name = "value"/></td>
         </tr>
         <tr>
            <td><input type = "submit" /></td>
         </tr>
      </table>
   </form>

   <p></p>

   <table>
      <tr>
         <th>Pin</th><th>Description</th><th>Mode</th><th>Value</th>
      </tr>
      {% for key, value in pinData.items() %}
         <tr> 
            <td>{{ key }}</td>
            <td>{{ value.description }}</td>
            <td>{{ value.mode }}</td>
            <td>{{ value.value }}</td>
         </tr>
      {% endfor %}
   </table>
   
{% endblock %}
